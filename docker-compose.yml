services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: knowledge_os
      POSTGRES_PASSWORD: knowledge_os_dev
      POSTGRES_DB: knowledge_os
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge_os -d knowledge_os"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://knowledge_os:knowledge_os_dev@postgres:5432/knowledge_os
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-secret-change-in-production
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./schemas:/app/schemas
    command: uvicorn knowledge_os.api.app:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
