<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Knowledge OS — UPSC Mentor</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --border: #2d3a4d;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #3b82f6;
      --success: #22c55e;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 1.1rem; font-weight: 600; }
    header span { color: var(--muted); font-size: 0.85rem; }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 320px 1fr;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      height: calc(100vh - 57px);
    }
    .sidebar {
      border-right: 1px solid var(--border);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      overflow-y: auto;
    }
    .chat {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .msg {
      max-width: 85%;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 0.95rem;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--accent);
      color: white;
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--border);
    }
    .citations {
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--muted);
    }
    .citation {
      margin-top: 0.35rem;
      padding: 0.35rem 0.5rem;
      background: var(--bg);
      border-radius: 6px;
    }
    .trust-badge {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .trust-ok { background: #14532d; color: var(--success); }
    .trust-low { background: #451a03; color: var(--warn); }
    .input-area {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.5rem;
    }
    input, button, select {
      font: inherit;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 0.6rem 0.75rem;
    }
    input { flex: 1; }
    button {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
      cursor: pointer;
      font-weight: 500;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    label { font-size: 0.8rem; color: var(--muted); display: block; margin-bottom: 0.25rem; }
    .field { display: flex; flex-direction: column; gap: 0.25rem; }
    .assets { font-size: 0.85rem; }
    .asset-item {
      padding: 0.5rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 0.35rem;
    }
    .status-ready { color: var(--success); }
    .status-processing { color: var(--warn); }
    h2 { font-size: 0.9rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  </style>
</head>
<body>
  <header>
    <h1>Knowledge OS <span>— UPSC Mentor</span></h1>
    <span id="status">Not connected</span>
  </header>
  <main>
    <aside class="sidebar">
      <div class="field">
        <label>API Base URL</label>
        <input id="apiBase" value="/api/v1" />
      </div>
      <div class="field">
        <label>Workspace ID</label>
        <input id="workspaceId" placeholder="uuid" />
      </div>
      <div class="field">
        <label>Bearer Token</label>
        <input id="token" type="password" placeholder="JWT token" />
      </div>
      <div class="field">
        <label>Agent ID</label>
        <input id="agentId" value="upsc-mentor-v1" />
      </div>
      <button id="connectBtn">Connect Session</button>
      <hr style="border-color: var(--border)" />
      <h2>Upload Knowledge</h2>
      <input type="file" id="fileInput" accept=".pdf,.txt,.md" />
      <button id="uploadBtn">Upload</button>
      <h2>Documents</h2>
      <div class="assets" id="assets"></div>
    </aside>
    <section class="chat">
      <div class="messages" id="messages"></div>
      <div class="input-area">
        <input id="question" placeholder="Ask a question about your uploaded documents..." />
        <button id="askBtn" disabled>Ask</button>
      </div>
    </section>
  </main>
  <script>
    let sessionId = null;
    const $ = (id) => document.getElementById(id);

    function headers() {
      const h = { "Content-Type": "application/json" };
      const t = $("token").value.trim();
      if (t) h["Authorization"] = `Bearer ${t}`;
      return h;
    }

    function api(path) {
      return `${$("apiBase").value.replace(/\/$/, "")}${path}`;
    }

    function addMessage(role, content, meta = {}) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.innerHTML = content;
      if (meta.trust) {
        const badge = document.createElement("div");
        badge.className = `trust-badge ${meta.trust.threshold_met ? "trust-ok" : "trust-low"}`;
        badge.textContent = `Trust: ${(meta.trust.overall * 100).toFixed(0)}% — ${meta.trust.explanation}`;
        div.appendChild(badge);
      }
      if (meta.citations?.length) {
        const cit = document.createElement("div");
        cit.className = "citations";
        cit.innerHTML = "<strong>Sources:</strong>";
        meta.citations.forEach((c) => {
          const item = document.createElement("div");
          item.className = "citation";
          item.textContent = `[${c.chunk_id.slice(0, 8)}…] p.${c.page || "?"} — ${c.text_excerpt}`;
          cit.appendChild(item);
        });
        div.appendChild(cit);
      }
      $("messages").appendChild(div);
      $("messages").scrollTop = $("messages").scrollHeight;
    }

    async function loadAssets() {
      const ws = $("workspaceId").value.trim();
      if (!ws) return;
      const res = await fetch(api(`/workspaces/${ws}/knowledge/assets`), { headers: headers() });
      if (!res.ok) return;
      const assets = await res.json();
      $("assets").innerHTML = assets.length
        ? assets.map((a) => `<div class="asset-item"><strong>${a.filename}</strong><br><span class="status-${a.status}">${a.status}</span></div>`).join("")
        : "<em>No documents yet</em>";
    }

    $("connectBtn").onclick = async () => {
      const ws = $("workspaceId").value.trim();
      const agent = $("agentId").value.trim();
      const res = await fetch(api(`/workspaces/${ws}/sessions`), {
        method: "POST",
        headers: headers(),
        body: JSON.stringify({ agent_id: agent }),
      });
      if (!res.ok) { alert("Connect failed: " + await res.text()); return; }
      const data = await res.json();
      sessionId = data.session_id;
      $("status").textContent = `Session ${sessionId.slice(0, 8)}…`;
      $("askBtn").disabled = false;
      await loadAssets();
    };

    $("uploadBtn").onclick = async () => {
      const ws = $("workspaceId").value.trim();
      const file = $("fileInput").files[0];
      if (!file) return alert("Select a file");
      const fd = new FormData();
      fd.append("file", file);
      fd.append("agent_id", $("agentId").value.trim());
      const h = {};
      const t = $("token").value.trim();
      if (t) h["Authorization"] = `Bearer ${t}`;
      const res = await fetch(api(`/workspaces/${ws}/knowledge/upload`), { method: "POST", headers: h, body: fd });
      if (!res.ok) { alert("Upload failed: " + await res.text()); return; }
      await loadAssets();
      addMessage("assistant", `Uploaded <strong>${file.name}</strong> — indexing complete.`);
    };

    $("askBtn").onclick = async () => {
      const q = $("question").value.trim();
      if (!q || !sessionId) return;
      const ws = $("workspaceId").value.trim();
      addMessage("user", q);
      $("question").value = "";
      $("askBtn").disabled = true;
      const res = await fetch(api(`/workspaces/${ws}/sessions/${sessionId}/query`), {
        method: "POST",
        headers: headers(),
        body: JSON.stringify({ question: q }),
      });
      $("askBtn").disabled = false;
      if (!res.ok) { addMessage("assistant", "Error: " + await res.text()); return; }
      const data = await res.json();
      addMessage("assistant", data.answer.replace(/\n/g, "<br>"), { trust: data.trust, citations: data.citations });
    };
  </script>
</body>
</html>
